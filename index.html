<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Craft AI — Hub Integracji AI dla Ekosystemu *craft</title>
  
<script type="module">
import init, * as bindings from '/ai-web-b75188575f0637b1.js';
const wasm = await init({ module_or_path: '/ai-web-b75188575f0637b1_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151617;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }
    #craft_ai_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #craft_ai_loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #151617;
      z-index: 100;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 18px;
    }
    .loading-title {
      font-size: 18px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 13px;
      color: #94a3b8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
<link rel="modulepreload" href="/ai-web-b75188575f0637b1.js" crossorigin="anonymous" integrity="sha384-n7BCNLGwh5AecTxDcOb+VKk6yjEQReZfb4YfTU8S5OU/n8+1TbAqUbExODpy3/7l"><link rel="preload" href="/ai-web-b75188575f0637b1_bg.wasm" crossorigin="anonymous" integrity="sha384-7VJf/ThmHve/BLvoc8nYh6MnRJhjhupBjW/BsCI3oImlwoEv/0jEzIdbyZhzxky5" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="craft_ai_canvas"></canvas>
  <div id="craft_ai_loading" role="status">
    <div class="spinner"></div>
    <div class="loading-title">Craft AI</div>
    <div class="loading-sub">Ładowanie silnika modeli i modułów WebAssembly…</div>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById("craft_ai_loading");
      if (loader && loader.parentNode) {
        loader.remove();
      }
    }
    window.addEventListener("TrunkApplicationStarted", hideLoader);
    setTimeout(hideLoader, 1500);
    function setCraftAiTheme(targetTheme) {
      const isLight = targetTheme === "light";
      const isSepia = targetTheme === "sepia";
      try {
        window.__pending_theme = targetTheme;
        document.documentElement.style.colorScheme = isLight ? "light" : "dark";
        const bg = isLight ? "#f8f9fa" : (isSepia ? "#f4ecd8" : "#151617");
        const fg = isLight ? "#1e293b" : (isSepia ? "#38281c" : "#f1f5f9");
        document.body.style.background = bg;
        const loader = document.getElementById("craft_ai_loading");
        if (loader) {
          loader.style.background = bg;
          loader.style.color = fg;
        }
        if (window.__craft_ai_repaint && typeof window.__craft_ai_repaint === "function") {
          window.__craft_ai_repaint();
        }
      } catch (err) {
        console.warn("[Craft AI] Theme error:", err);
      }
    }

    window.addEventListener("message", (event) => {
      if (!event.data) return;
      const theme = event.data.theme || (event.data.type === "set_theme" ? (event.data.theme || event.data.value) : null);
      if (theme === "light" || theme === "dark" || theme === "sepia") {
        setCraftAiTheme(theme);
      }
    });

    const params = new URLSearchParams(window.location.search);
    const initialTheme = params.get("theme");
    if (initialTheme) {
      setCraftAiTheme(initialTheme);
    }
  </script>
</body>
</html>
